<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2025 SDG Research Repository - UCU</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
      tailwind.config = {
          theme: {
              extend: {
                  colors: {
                      'ucu-blue': '#394a8a',
                      'ucu-blue-dark': '#24305e',
                      'ucu-yellow': '#fbef4b',
                      'ucu-red': '#c43643',
                      'ucu-white': '#ffffff',
                      'dark-red': '#912020',
                      'canvas': '#f4f7fa',
                      'muted': '#555555',
                      'main2': '#1f1f1f',
                      // SDG Official Brand Colors for Exception Use Only
                      'sdg-1': '#E5243B',
                      'sdg-3': '#4C9F38',
                      'sdg-4': '#C5192D',
                      'sdg-5': '#FF3A21',
                      'sdg-16': '#00689D',
                      'sdg-17': '#19486A',
                  },
                  fontFamily: { sans: ['Montserrat', 'sans-serif'] }
              }
          }
      }
  </script>

  <style>
    /* Base styles for the scroll reveal animation */
    .reveal-on-scroll {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    .reveal-on-scroll.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
  
  <!-- Data Store loaded before components -->
  <script src="../js/research-data.js" defer></script>
  <script src="../js/core-ui.js" defer></script>
  <script src="../js/visual-media.js" defer></script>
  <script src="../js/impact-feeds.js" defer></script>
  <script src="../js/institutional-data.js" defer></script>
</head>

<body class="bg-canvas text-main2 font-sans antialiased min-h-screen flex flex-col relative z-0 overflow-x-hidden">
  
  <ucu-header base-path="../"></ucu-header>

  <!-- Global Uniform Hero Banner with CLS Prevention and Scroll Animation -->
  <ucu-hero-banner 
    class="block w-full min-h-[320px] md:min-h-[360px] reveal-on-scroll"
    bg-color="bg-ucu-blue-dark" 
    eyebrow="Institutional Archive"
    headline="SDG Research"
    highlight="2025."
    description="An open-access archive of Urdaneta City University's academic contributions. Explore peer-reviewed publications, institutional studies, and localized research directly aligned with the United Nations' Sustainable Development Goals.">
  </ucu-hero-banner>

  <!-- Standardized layout block matching the Rankings page -->
  <main class="w-full flex-grow relative z-10 flex flex-col bg-canvas">
    
    <!-- Constrain the inner content width and apply standard top/bottom spacing with Scroll Animation -->
    <div class="max-w-[1280px] w-full mx-auto px-4 sm:px-6 lg:px-8 flex flex-col pt-12 pb-24 reveal-on-scroll" style="transition-delay: 200ms;">
        <!-- The Web Component handles the filters and data mapping -->
        <ucu-research-feed year="2025"></ucu-research-feed>
    </div>

  </main>

  <!-- Footer with Scroll Animation -->
  <ucu-footer base-path="../" class="reveal-on-scroll"></ucu-footer>

  <!-- Scroll Animation Observer Script -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const revealElements = document.querySelectorAll(".reveal-on-scroll");

      const revealObserver = new IntersectionObserver(
        (entries, observer) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              // Optional: Stop observing once revealed if you only want the animation to happen once per page load
              observer.unobserve(entry.target);
            }
          });
        },
        {
          root: null,
          rootMargin: "0px 0px -50px 0px", // Triggers slightly before the element fully enters the viewport
          threshold: 0.1, // Triggers when 10% of the element is visible
        }
      );

      revealElements.forEach((el) => revealObserver.observe(el));
    });
  </script>

</body>
</html>

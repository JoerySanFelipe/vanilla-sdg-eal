<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University Rankings - UCU External Office</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
      tailwind.config = {
          theme: {
              extend: {
                  colors: {
                      'ucu-blue': '#394a8a',
                      'ucu-blue-dark': '#24305e',
                      'ucu-yellow': '#fbef4b',
                      'ucu-red': '#c43643',
                      'ucu-white': '#ffffff',
                      'dark-red': '#912020',
                      'canvas': '#f4f7fa',
                      'muted': '#555555',
                      'main2': '#1f1f1f',
                      // SDG Official Brand Colors for Exception Use Only
                      'sdg-1': '#E5243B',
                      'sdg-3': '#4C9F38',
                      'sdg-4': '#C5192D',
                      'sdg-5': '#FF3A21',
                      'sdg-16': '#00689D',
                      'sdg-17': '#19486A',
                  },
                  fontFamily: { sans: ['Montserrat', 'sans-serif'] }
              }
          }
      }
  </script>
  
  <!-- Data Store script loaded before components -->
  <script src="./js/rankings-data.js" defer></script>
  <script src="./js/global-components.js" defer></script>
</head>

<body class="bg-canvas text-main2 font-sans antialiased min-h-screen flex flex-col relative z-0 overflow-x-hidden">
  
  <ucu-header base-path="./"></ucu-header>

  <!-- Structural classes to reserve space and prevent layout shifting -->
  <ucu-hero-banner 
    class="block w-full min-h-[320px] md:min-h-[360px]"
    bg-color="bg-ucu-blue-dark" 
    eyebrow="A Network of Excellence"
    headline="Connecting UCU"
    highlight="Globally"
    description="Forging high-impact relationships with global academic institutions and premier industry leaders to elevate the educational standard of Urdaneta City University.">
  </ucu-hero-banner>

  <main class="w-full flex-grow relative z-10 flex flex-col bg-canvas">

    <!-- CROWN JEWELS: Animated Horizontal Carousel -->
    <section class="max-w-[1280px] w-full mx-auto px-4 sm:px-6 lg:px-8 relative z-20 pt-12 mb-24 reveal opacity-0 translate-y-8 transition-all duration-[800ms] ease-[cubic-bezier(0.16,1,0.3,1)] delay-100">      
      
      <!-- NEW: Standardized Section Heading -->
      <div class="flex items-center w-full mb-8 gap-4">
        <div class="w-1.5 h-6 bg-ucu-red rounded-full shadow-sm flex-shrink-0"></div>
        <h2 class="flex-shrink-0 text-xl md:text-2xl font-bold text-ucu-blue-dark tracking-tight m-0 pr-2">Current Global Standing</h2>
        <div class="flex-grow h-px bg-gray-300/70 rounded-full"></div>
      </div>
      
      <!-- Structural classes to reserve carousel space -->
      <ucu-ranking-carousel class="block w-full min-h-[350px] md:min-h-[400px]"></ucu-ranking-carousel>

    </section>

    <!-- GRANULAR DATA MATRIX: Historical Timeline -->
    <section class="max-w-[1280px] w-full mx-auto px-4 sm:px-6 lg:px-8 relative z-20 mb-24">
      <div class="w-full">
        
        <div class="flex flex-col md:flex-row md:items-end justify-between mb-16 gap-8">
          <div>
            <h2 class="text-xs font-black uppercase tracking-[0.2em] text-muted mb-3">Institutional Trajectory</h2>
            <h3 class="text-3xl md:text-4xl font-black text-ucu-blue-dark">Historical Performance</h3>
          </div>

          <!-- The Filters -->
          <div class="flex flex-wrap gap-2.5" id="filter-group">
            <button data-filter="all" class="filter-btn px-4 py-2 rounded-full text-xs font-bold border border-white/50 bg-white/60 transition-all hover:bg-white hover:shadow-sm data-[active=true]:bg-ucu-blue-dark data-[active=true]:text-white data-[active=true]:border-ucu-blue-dark text-main2" data-active="true">All Rankings</button>
            <button data-filter="WURI" class="filter-btn px-4 py-2 rounded-full text-xs font-bold border border-white/50 bg-white/60 transition-all hover:bg-white hover:shadow-sm data-[active=true]:bg-ucu-blue-dark data-[active=true]:text-white data-[active=true]:border-ucu-blue-dark text-main2" data-active="false">WURI</button>
            <button data-filter="UI GreenMetric" class="filter-btn px-4 py-2 rounded-full text-xs font-bold border border-white/50 bg-white/60 transition-all hover:bg-white hover:shadow-sm data-[active=true]:bg-ucu-blue-dark data-[active=true]:text-white data-[active=true]:border-ucu-blue-dark text-main2" data-active="false">UI GreenMetric</button>
            <button data-filter="THE" class="filter-btn px-4 py-2 rounded-full text-xs font-bold border border-white/50 bg-white/60 transition-all hover:bg-white hover:shadow-sm data-[active=true]:bg-ucu-blue-dark data-[active=true]:text-white data-[active=true]:border-ucu-blue-dark text-main2" data-active="false">THE Impact</button>
            <button data-filter="AppliedHE" class="filter-btn px-4 py-2 rounded-full text-xs font-bold border border-white/50 bg-white/60 transition-all hover:bg-white hover:shadow-sm data-[active=true]:bg-ucu-blue-dark data-[active=true]:text-white data-[active=true]:border-ucu-blue-dark text-main2" data-active="false">AppliedHE</button>
          </div>
        </div>

        <!-- The Web Component Engine handles everything inside -->
        <ucu-ranking-timeline></ucu-ranking-timeline>

      </div>
    </section>

  </main>

  <ucu-footer base-path="./"></ucu-footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Scroll Reveal Observer
      const revealTargets = document.querySelectorAll(".reveal");
      if (revealTargets.length > 0) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.remove("opacity-0", "translate-y-8");
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });
        revealTargets.forEach((el) => observer.observe(el));
      }

      // 2. Dynamic Timeline Filtering Logic
      const buttons = document.querySelectorAll('.filter-btn');

      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          const filter = btn.getAttribute('data-filter');
          
          // Toggle active visual states on buttons
          buttons.forEach(b => b.setAttribute('data-active', 'false'));
          btn.setAttribute('data-active', 'true');

          let visibleCount = 0;
          
          // Dynamically query the timeline items generated by the Web Component
          const items = document.querySelectorAll('ucu-ranking-timeline .timeline-item');
          const emptyState = document.getElementById('empty-state');

          items.forEach(item => {
            const org = item.getAttribute('data-org');
            if (filter === 'all' || org === filter) {
              item.style.display = 'flex';
              item.classList.add('opacity-0', 'scale-95');
              
              // Force a rapid reflow to ensure the animation triggers properly
              void item.offsetWidth; 
              
              setTimeout(() => {
                item.classList.remove('opacity-0', 'scale-95');
              }, 50);
              visibleCount++;
            } else {
              item.style.display = 'none';
            }
          });

          if (emptyState) {
            emptyState.style.display = visibleCount === 0 ? 'block' : 'none';
          }
        });
      });
    });
  </script>
</body>
</html>
